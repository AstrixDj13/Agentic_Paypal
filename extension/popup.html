<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PayPal Pocket</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: #0b1324; background: #f5f7fa; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #1f1f1f; color: #fff; }
    header img { width: 28px; height: 28px; border-radius: 8px; }
    header strong { font-size: 15px; }
    main { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5b6475; font-weight: 600; }
    input { font: inherit; padding: 9px 10px; border: 1px solid #d9dee8; border-radius: 10px; background: #fff; color: #0b1324; }
    button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 999px; background: #0070e0; color: #fff; cursor: pointer; }
    button.ghost { background: #e8eef8; color: #0b3a82; }
    button:disabled { opacity: .5; cursor: default; }
    .muted { color: #5b6475; font-size: 12px; }
    .err { color: #c2291d; font-size: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ok { display: inline-flex; align-items: center; gap: 6px; color: #0e7c4a; font-weight: 600; }
    .ok::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #0e7c4a; }
    .paused { color: #b45309; }
    .paused::before { background: #b45309; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    li { background: #fff; border-radius: 10px; padding: 8px 10px; }
    li span { display: block; }
    .switch { position: relative; width: 42px; height: 24px; border-radius: 999px; background: #c9d0dc; border: 0; padding: 0; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
    .switch.on { background: #34c759; }
    .switch.on::after { left: 21px; }
  </style>
</head>
<body>
  <header><img src="icon128.png" alt="" /><strong>PayPal Pocket</strong></header>
  <main id="app"></main>
  <script src="popup.js"></script>
</body>
</html>
